name: Set up verified quality tools
description: Installs checksum-verified Gitleaks and actionlint binaries on Linux runners.

runs:
  using: composite
  steps:
    - name: Install Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        install_dir="$RUNNER_TEMP/gitleaks-bin"
        curl --fail --silent --show-error --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$archive"
        echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
        mkdir --parents "$install_dir"
        tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
        chmod 0755 "$install_dir/gitleaks"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        archive="$RUNNER_TEMP/actionlint.tar.gz"
        install_dir="$RUNNER_TEMP/actionlint-bin"
        curl --fail --silent --show-error --location \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          --output "$archive"
        echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
        mkdir --parents "$install_dir"
        tar --extract --gzip --file "$archive" --directory "$install_dir" actionlint
        chmod 0755 "$install_dir/actionlint"
        echo "$install_dir" >> "$GITHUB_PATH"
