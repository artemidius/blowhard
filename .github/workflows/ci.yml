name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install verified quality tools
        uses: ./.github/actions/setup-quality-tools

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Run quality and security gate
        run: ./gradlew --no-daemon --no-configuration-cache qualityCheck

      - name: Test distribution inspection
        run: python3 -m unittest discover -s tools/packaging -p 'test_*.py' -v

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            apps/desktop/build/reports/dependency-license/
            build/reports/detekt/
            build/reports/kover/
            build/dokka/html/
            adapters/**/build/test-results/
            apps/desktop/build/test-results/
            core/**/build/test-results/
            shared-ui/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  desktop:
    name: Desktop / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: ubuntu-24.04
            gradle: ./gradlew
            package_task: :apps:desktop:packageDeb
            platform: linux
            architecture: amd64
          - label: Windows
            runner: windows-2025
            gradle: ./gradlew.bat
            package_task: :apps:desktop:packageMsi
            platform: windows
            architecture: x64
          - label: macOS
            runner: macos-15
            gradle: ./gradlew
            package_task: :apps:desktop:packageDmg
            platform: macos
            architecture: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build desktop application and run core tests
        run: >-
          ${{ matrix.gradle }} --no-daemon
          :apps:desktop:build
          :core:api:desktopTest
          :core:application:desktopTest
          :core:domain:desktopTest
          :adapters:fixture:desktopTest
          :adapters:mistral:desktopTest
          :adapters:persistence:desktopTest
          :shared-ui:desktopTest

      - name: Build native package
        run: >-
          ${{ matrix.gradle }} --no-daemon --no-configuration-cache
          ${{ matrix.package_task }}

      - name: Audit desktop runtime licenses
        run: >-
          ${{ matrix.gradle }} --no-daemon --no-parallel --no-configuration-cache
          :apps:desktop:checkLicense
          :apps:desktop:verifyLicenseInventory

      - name: Install and launch Linux package
        if: ${{ runner.os == 'Linux' }}
        run: ./tools/packaging/verify_linux_package.sh .

      - name: Install and launch Windows package
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./tools/packaging/Verify-WindowsPackage.ps1 .

      - name: Install and launch macOS package
        if: ${{ runner.os == 'macOS' }}
        run: ./tools/packaging/verify_macos_package.sh .

      - name: Generate release evidence
        run: >-
          python tools/packaging/release_evidence.py create .
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
          --source-revision ${{ github.sha }}

      - name: Verify release evidence
        run: >-
          python tools/packaging/release_evidence.py verify .
          apps/desktop/build/release-evidence/${{ matrix.platform }}-${{ matrix.architecture }}/manifest.json

      - name: Verify portable release archive ordering
        if: ${{ runner.os == 'Windows' }}
        run: python -m unittest discover -s tools/packaging -p 'test_release_gate.py' -v

      - name: Upload desktop evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.label }}-evidence
          path: |
            apps/desktop/build/libs/
            apps/desktop/build/compose/binaries/main/deb/*.deb
            apps/desktop/build/compose/binaries/main/dmg/*.dmg
            apps/desktop/build/compose/binaries/main/msi/*.msi
            apps/desktop/build/release-evidence/
            apps/desktop/build/reports/dependency-license/
            apps/desktop/build/test-results/test/
            adapters/**/build/test-results/desktopTest/
            core/**/build/test-results/desktopTest/
            shared-ui/build/test-results/desktopTest/
          if-no-files-found: warn
          retention-days: 7

  android-shared:
    name: Android shared
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile Android shared code and run host tests
        run: >-
          ./gradlew --no-daemon
          :shared-ui:compileAndroidMain
          :core:api:testAndroidHostTest
          :core:application:testAndroidHostTest
          :core:domain:testAndroidHostTest
          :adapters:fixture:testAndroidHostTest
          :adapters:mistral:testAndroidHostTest
          :adapters:persistence:testAndroidHostTest
          :shared-ui:testAndroidHostTest

      - name: Upload Android evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-shared-evidence
          path: |
            adapters/**/build/test-results/testAndroidHostTest/
            core/**/build/test-results/testAndroidHostTest/
            shared-ui/build/test-results/testAndroidHostTest/
          if-no-files-found: warn
          retention-days: 7

  apple-shared:
    name: Apple shared
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun --find ld

      - name: Compile Apple shared code and run simulator tests
        run: >-
          ./gradlew --no-daemon
          :shared-ui:compileKotlinIosArm64
          :shared-ui:compileKotlinIosSimulatorArm64
          :core:api:iosSimulatorArm64Test
          :core:application:iosSimulatorArm64Test
          :core:domain:iosSimulatorArm64Test
          :adapters:fixture:compileKotlinIosArm64
          :adapters:fixture:compileKotlinIosSimulatorArm64
          :adapters:fixture:iosSimulatorArm64Test
          :adapters:mistral:compileKotlinIosArm64
          :adapters:mistral:compileKotlinIosSimulatorArm64
          :adapters:mistral:iosSimulatorArm64Test
          :adapters:persistence:compileKotlinIosArm64
          :adapters:persistence:compileKotlinIosSimulatorArm64
          :adapters:persistence:iosSimulatorArm64Test
          :shared-ui:iosSimulatorArm64Test

      - name: Upload Apple evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-shared-evidence
          path: |
            adapters/**/build/test-results/iosSimulatorArm64Test/
            core/**/build/test-results/iosSimulatorArm64Test/
            shared-ui/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: warn
          retention-days: 7
