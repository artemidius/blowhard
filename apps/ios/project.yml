name: Blowhard

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    CLANG_ENABLE_MODULES: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
    SWIFT_VERSION: 5.0

targets:
  Blowhard:
    type: application
    platform: iOS
    sources:
      - path: Blowhard
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew --no-daemon :apps:ios-shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Blowhard/Blowhard.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ios-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Blowhard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - BlowhardIos
          - -lsqlite3
        PRODUCT_BUNDLE_IDENTIFIER: io.github.artemidius.blowhard
        PRODUCT_NAME: Blowhard
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: 1,2
    scheme:
      gatherCoverageData: true
      testTargets: []
